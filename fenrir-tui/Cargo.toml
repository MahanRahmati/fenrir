[package]
name = "fenrir-tui"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
fenrir-core = { path = "../fenrir-core" }
anyhow = "1.0.104"
tokio = { version = "1.54.1", features = ["macros", "signal", "sync", "time"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
uuid = { version = "1.29.1", features = ["v7"] }

[lints]
workspace = true
