[workspace]
members = [".", "fenrir-core"]
resolver = "3"

[package]
name = "fenrir"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
fenrir-core = { path = "fenrir-core" }
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "sync"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
async-trait = "0.1.92"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
tui-widget-list = "0.15.3"
uuid = { version = "1.27.0", features = ["v7"] }

[workspace.lints.clippy]
needless_return = "allow"
uninlined_format_args = "deny"

[lints]
workspace = true
