[workspace]
members = [".", "fenrir-core", "fenrir-cli", "fenrir-tui", "fenrir-server"]
resolver = "3"

[package]
name = "fenrir"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
fenrir-core = { path = "fenrir-core" }
fenrir-cli = { path = "fenrir-cli" }
fenrir-tui = { path = "fenrir-tui" }
fenrir-server = { path = "fenrir-server" }
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }

[workspace.lints.clippy]
needless_return = "allow"
uninlined_format_args = "deny"

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1
strip = true
