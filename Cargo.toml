[package]
name = "fenrir"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
toml = "1.1.2"
xdg = "3.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
chrono = { version = "0.4.44", features = ["serde"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = [
  "fs",
  "macros",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = { version = "0.7.19", features = ["rt"] }
futures = "0.3.32"
bytes = "1.11.1"
turso = "0.6.1"
async-trait = "0.1.91"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
tui-widget-list = "0.15.3"

[lints.clippy]
needless_return = "allow"
uninlined_format_args = "deny"
