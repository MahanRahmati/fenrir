[package]
name = "fenrir-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
toml = "1.2.1"
xdg = "3.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
anyhow = "1.0.104"
tokio = { version = "1.54.1", features = [
  "fs",
  "macros",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = { version = "0.7.20", features = ["rt"] }
futures = "0.3.34"
bytes = "1.12.1"
turso = "0.8.3"
async-trait = "0.1.92"
base64 = "0.23.1"
uuid = { version = "1.29.1", features = ["v7"] }

[lints]
workspace = true
