[package]
name = "fenrir-server"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
fenrir-core = { path = "../fenrir-core" }
anyhow = "1.0.104"
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
futures = "0.3.34"
uuid = { version = "1.29.1", features = ["v7"] }
axum = "0.8.9"

[lints]
workspace = true
