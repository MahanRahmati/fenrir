[package]
name = "fenrir-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
fenrir-core = { path = "../fenrir-core" }
anyhow = "1.0.104"
tokio = { version = "1.54.1", features = ["macros", "signal", "sync"] }
uuid = { version = "1.29.1", features = ["v7"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints]
workspace = true
